{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada - UNI Open Source</title>
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
</head>
<body>
    <div class="background-overlay"></div>
    
    <nav class="navbar">
        <div class="logo">
            <img src="{% static 'users/img/logo_uos_circular.png' %}" width="32" height="32">
            <span class="logo-text">UNI <span class="highlight">OPEN SOURCE</span></span>
        </div>
    </nav>

    <main class="card-container">
        <div class="card" style="text-align: center;">
            <h1 style="margin-bottom: 15px;">¡Contraseña actualizada!</h1>
            
            <div style="margin: 20px 0;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>

            <p style="color: #666; line-height: 1.6; margin-bottom: 25px; font-size: 15px;">
                Tu contraseña ha sido cambiada exitosamente. <br>Ya puedes volver a entrar a tu cuenta de UNI Open Source.
            </p>
            
            <a href="{% url 'login' %}" class="btn-submit" style="display: inline-block; text-decoration: none;">Iniciar Sesión</a>
        </div>
    </main>
</body>
</html>
