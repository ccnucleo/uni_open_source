{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado - UNI Open Source</title>
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
</head>
<body>
    <div class="background-overlay"></div>
    
    <nav class="navbar">
        <div class="logo">
            <img src="{% static 'users/img/logo_uos_circular.png' %}" width="32" height="32">
            <span class="logo-text">UNI <span class="highlight">OPEN SOURCE</span></span>
        </div>
    </nav>

    <main class="card-container">
        <div class="card" style="text-align: center;">
            
            <h1 style="margin-bottom: 15px;">¡Revisa tu bandeja!</h1>

            <div style="margin: 20px 0;">
                <img src="{% static 'users/img/email_check_icon.png' %}" alt="Revisa tu bandeja" style="max-width: 300px; height: auto;">
            </div>
            
            <p style="color: #666; line-height: 1.6; margin-bottom: 25px; font-size: 15px;">
                Te hemos enviado un correo electrónico con las instrucciones para configurar tu nueva contraseña. <br><br>
                Si no lo encuentras, por favor revisa tu carpeta de spam o correo no deseado.
            </p>
            
            <a href="{% url 'login' %}" class="btn-submit" style="display: inline-block; text-decoration: none;">Volver al inicio</a>
        </div>
    </main>
</body>
</html>
