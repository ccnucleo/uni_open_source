{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regístrate - UNI Open Source</title>
    <link rel="stylesheet" href="{% static 'users/css/register.css' %}">
</head>
<body>
    <div class="background-overlay"></div>
    
    <nav class="navbar">
        <div class="logo">
            <img src="{% static 'users/img/logo_uos_circular.png' %}" width="32" height="32">
            <span class="logo-text">UNI <span class="highlight">OPEN SOURCE</span></span>
        </div>
        <div class="nav-links">
            <a href="#">Inicio</a>
            <a href="#">Proyectos</a>
            <a href="#">Academy</a>
        </div>
        <div class="auth-buttons">
            <a href="{% url 'login' %}" class="btn-login">Iniciar Sesión</a>
            <a href="{% url 'register' %}" class="btn-register active">Registrarse</a>
        </div>
    </nav>

    <main class="card-container">
        <div class="card">
            <h1>Regístrate</h1>
            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="username">Nombre</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Crear Cuenta</button>
            </form>
        </div>
    </main>
</body>
</html>
