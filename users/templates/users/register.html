{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regístrate - UNI Open Source</title>
    <link rel="stylesheet" href="{% static 'users/css/register.css' %}">
</head>
<body>
    <div class="background-overlay"></div>
    
    <nav class="navbar">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="#FF6B2B" stroke="#FF6B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
            <span class="logo-text">UNI <span class="highlight">OPEN SOURCE</span></span>
        </div>
        <div class="nav-links">
            <a href="#">Inicio</a>
            <a href="#">Proyectos</a>
            <a href="#">Academy</a>
        </div>
        <div class="auth-buttons">
            <a href="{% url 'login' %}" class="btn-login">Iniciar Sesión</a>
            <a href="{% url 'register' %}" class="btn-register active">Registrarse</a>
        </div>
    </nav>

    <main class="card-container">
        <div class="card">
            <h1>Regístrate</h1>
            <form action="#" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Crear Cuenta</button>
            </form>
        </div>
    </main>
</body>
</html>
