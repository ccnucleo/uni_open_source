{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - UNI Open Source</title>
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
</head>
<body>
    <div class="background-overlay"></div>
    
    <nav class="navbar">
        <div class="logo">
            <img src="{% static 'users/img/logo_uos_circular.png' %}" width="32" height="32">
            <span class="logo-text">UNI <span class="highlight">OPEN SOURCE</span></span>
        </div>
        <div class="nav-links">
            <a href="#">Inicio</a>
            <a href="#">Proyectos</a>
            <a href="#">Academy</a>
        </div>
        <div class="auth-buttons">
            <a href="{% url 'login' %}" class="btn-login active">Iniciar Sesión</a>
            <a href="{% url 'register' %}" class="btn-register">Registrarse</a>
        </div>
    </nav>

    <main class="card-container">
        <div class="card">
            <h1>Iniciar Sesión</h1>
            <form action="#" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Entrar por correo</button>
                <div class="forgot-password-container">
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
