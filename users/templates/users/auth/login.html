{% extends 'users/base.html' %}
{% load static %}

{% block title %}Iniciar Sesión - UNI Open Source{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
{% endblock %}

{% block content %}
    <main class="card-container">
        <div class="card">
            <h1>Iniciar Sesión</h1>
            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Entrar por correo</button>
                <div class="forgot-password-container">
                    <a href="{% url 'reset_password' %}" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </main>
{% endblock %}
