{% load static %}
<aside class="sidebar-nav" id="sidebar-nav">
    <div class="sidebar-logo">
        <img src="{% static 'web/img/logo_uos.png' %}" alt="Logo UNI Open Source" class="sidebar-logo-img">
    </div>
    <nav class="sidebar-menu">
        <a href="/" class="sidebar-link{% if active_section == 'home' %} active{% endif %}">
            <div class="sidebar-icon"><i class="fas fa-home"></i></div>
            <span>Inicio</span>
        </a>
        <a href="/projects/" class="sidebar-link{% if active_section == 'projects' %} active{% endif %}">
            <div class="sidebar-icon"><i class="fas fa-search"></i></div>
            <span>Proyectos</span>
        </a>
        {% if user.is_authenticated %}
        <a href="/courses/" class="sidebar-link{% if active_section == 'courses' %} active{% endif %}">
            <div class="sidebar-icon"><i class="fas fa-graduation-cap"></i></div>
            <span>Courses</span>
        </a>
        <a href="{% url 'community:list' %}"
            class="sidebar-link{% if active_section == 'community' %} active{% endif %}">
            <div class="sidebar-icon"><i class="fas fa-users"></i></div>
            <span>Comunidad</span>
        </a>
        {% endif %}
    </nav>

    <div class="sidebar-bottom">
        {% if user.is_authenticated %}
        <a href="{% url 'ajustes' %}"
            class="sidebar-link sidebar-link-sm{% if active_section == 'settings' %} active{% endif %}">
            <div class="sidebar-icon"><i class="fas fa-cog"></i></div><span>Ajustes</span>
        </a>
        {% else %}
        <a href="{% url 'accounts:login' %}" class="sidebar-link sidebar-link-sm">
            <div class="sidebar-icon"><i class="fas fa-right-to-bracket"></i></div><span>Iniciar Sesión</span>
        </a>
        {% endif %}
    </div>
</aside>
