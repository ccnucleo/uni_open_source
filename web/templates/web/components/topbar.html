{% load static %}
<header class="topbar app-topbar">
    <div class="topbar-left app-topbar-left">
        <button type="button" class="sidebar-toggle-btn" id="sidebar-toggle-btn"
            aria-label="Comprimir o expandir barra lateral" aria-controls="sidebar-nav" aria-expanded="true">
            <i class="fas fa-bars"></i>
        </button>

        <div class="page-heading-group">
            <div class="platform-name"><strong>UNI</strong> OPEN SOURCE</div>
            <h1 class="app-page-title">{{ page_title|default:'Panel' }}</h1>
        </div>
    </div>

    <div class="topbar-right app-topbar-right">

        <div class="auth-btns">
            {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}" class="btn-login-top"><i class="fas fa-user"></i> Mi Perfil</a>
            <form method="POST" action="{% url 'accounts:logout' %}" class="topbar-logout-form">
                {% csrf_token %}
                <button type="submit" class="btn-reg-top"><i class="fas fa-sign-out-alt"></i> Cerrar Sesion</button>
            </form>
            <a href="{% url 'accounts:profile' %}" class="topbar-avatar" aria-label="Ir a mi perfil" style="overflow: hidden;">
                {% if user.profile.avatar %}
                    <img src="{{ user.profile.avatar.url }}" alt="Avatar de perfil" style="width: 100%; height: 100%; object-fit: cover;">
                {% else %}
                    <div class="auto-avatar" data-name="{{ user.username }}" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; color: white;">{{ user.username|make_list|first|upper }}</div>
                {% endif %}
            </a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="btn-login-top"><i class="fas fa-sign-in-alt"></i> Iniciar
                sesion</a>
            <a href="{% url 'accounts:register' %}" class="btn-reg-top"><i class="fas fa-user-plus"></i> Registrarse</a>
            {% endif %}
        </div>
    </div>
</header>
