{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UNI Open Source{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'web/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'web/css/themes.css' %}">
    <link rel="stylesheet" href="{% static 'web/css/layouts.css' %}">
    
    <!-- Prevención de FOUC e Inyección de Tema por Defecto -->
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme !== 'light' && theme !== 'dark') {
                localStorage.setItem('theme', 'light');
                theme = 'light';
            }
            var themeClass = 'theme-' + theme;
            
            // MutationObserver para inyectar la clase del tema en el body de inmediato
            var observer = new MutationObserver(function(mutations) {
                if (document.body) {
                    document.body.classList.add(themeClass);
                    observer.disconnect();
                }
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
            
            // Respaldo en DOMContentLoaded por si acaso
            document.addEventListener('DOMContentLoaded', function() {
                if (document.body && !document.body.classList.contains(themeClass)) {
                    document.body.classList.add(themeClass);
                }
            });
        })();
    </script>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'web/components/sidebar.html' %}

    <div class="main-wrapper sidebar-main-wrapper">
        {% include 'web/components/topbar.html' %}
        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
        {% include 'web/components/footer.html' %}
    </div>

    <script src="{% static 'web/js/themes.js' %}"></script>
    <script src="{% static 'web/js/sidebar-collapse.js' %}"></script>
    <script src="{% static 'web/js/loading.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Paleta amplia y variada: cálidos, fríos, sobrios
            const projectColors = [
                '#f97316', // Naranja
                '#eab308', // Amarillo oscuro
                '#ef4444', // Rojo
                '#10b981', // Esmeralda
                '#8b5cf6', // Violeta
                '#3b82f6', // Azul
                '#14b8a6', // Teal
                '#ec4899', // Rosa
                '#f59e0b', // Ámbar
                '#6366f1', // Índigo
                '#84cc16', // Lima
                '#06b6d4', // Cyan
                '#d97706', // Naranja oscuro
                '#7c3aed', // Púrpura
                '#16a34a', // Verde
                '#dc2626', // Rojo vivo
            ];

            // Gradients para el hero del project_detail
            const heroGradients = [
                'linear-gradient(135deg, #f97316, #ea580c)', // Naranja
                'linear-gradient(135deg, #eab308, #ca8a04)', // Amarillo
                'linear-gradient(135deg, #ef4444, #b91c1c)', // Rojo
                'linear-gradient(135deg, #10b981, #047857)', // Esmeralda
                'linear-gradient(135deg, #8b5cf6, #6d28d9)', // Violeta
                'linear-gradient(135deg, #3b82f6, #1d4ed8)', // Azul
                'linear-gradient(135deg, #ec4899, #be185d)', // Rosa
                'linear-gradient(135deg, #f59e0b, #d97706)', // Ámbar
                'linear-gradient(135deg, #14b8a6, #0f766e)', // Teal
                'linear-gradient(135deg, #6366f1, #4338ca)', // Índigo
                'linear-gradient(135deg, #84cc16, #4d7c0f)', // Lima
                'linear-gradient(135deg, #06b6d4, #0e7490)', // Cyan
                'linear-gradient(135deg, #d97706, #92400e)', // Naranja oscuro
                'linear-gradient(135deg, #7c3aed, #4c1d95)', // Púrpura
                'linear-gradient(135deg, #16a34a, #14532d)', // Verde
                'linear-gradient(135deg, #dc2626, #991b1b)', // Rojo vivo
            ];

            const getIndex = (str, len) => {
                let hash = 0;
                for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
                return Math.abs(hash) % len;
            };

            // 1. Colorear miniaturas de tarjetas de proyecto (clase proj-thumb)
            document.querySelectorAll('.proj-thumb').forEach(el => {
                const title = el.getAttribute('data-title') || 'Proyecto';
                el.style.background = projectColors[getIndex(title, projectColors.length)];
            });

            // 2. Colorear la portada hero del project_detail (clase no-image)
            document.querySelectorAll('.hero-main-card.no-image').forEach(el => {
                const title = el.getAttribute('data-title') || 'Proyecto';
                el.style.background = heroGradients[getIndex(title, heroGradients.length)];
            });

            // 3. Colorear avatares de iniciales (auto-avatar, autor, colaboradores)
            const avatarColors = ['#f97316', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#f43f5e', '#6366f1'];
            document.querySelectorAll('.auto-avatar, .author-avatar, .avatar-stack-item, .project-card-avatar').forEach(el => {
                if (el.querySelector('img')) return; // Si tiene foto, no colorear
                const name = el.getAttribute('data-name') || el.innerText.trim();
                if (name) {
                    el.style.backgroundColor = avatarColors[getIndex(name, avatarColors.length)];
                    el.style.color = '#fff';
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
